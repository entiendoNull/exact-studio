# Makes a release, and only when a maintainer starts it: Actions › release › Run workflow, or
#   gh workflow run release.yml -f version=0.2.0
# It runs the checks, builds the app, packs it as a disk image, and publishes the GitHub
# release v<version> from the commit it ran on.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as 0.2.0
        required: true
        type: string

concurrency:
  group: release

env:
  # The expo/exact commit the app is built against. Move it when the app needs a newer Exact.
  EXACT_REF: db72e04f9339d595cd3d5fa2a1383ffde1a7ccf7
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version }}

jobs:
  mac:
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: exact-studio

      - uses: actions/checkout@v4
        with:
          repository: expo/exact
          ref: ${{ env.EXACT_REF }}
          path: exact

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Exact's tools
        working-directory: exact-studio
        # setup installs Playwright's pinned Chromium, but on this runner its last check looks for
        # another revision and fails. CHROME names the one it installed, and --check then decides.
        run: |
          bun ../exact/scripts/exact.mjs setup || true
          shell="$(ls "$HOME"/Library/Caches/ms-playwright/chromium_headless_shell-*/chrome-headless-shell-mac-arm64/chrome-headless-shell | tail -1)"
          echo "CHROME=$shell" >> "$GITHUB_ENV"
          CHROME="$shell" bun ../exact/scripts/exact.mjs setup --check

      - name: ref-check
        working-directory: exact-studio
        run: ./ref-check

      - name: test
        working-directory: exact-studio
        run: bun exact.mjs test

      - name: Disk image
        working-directory: exact-studio
        run: tools/make-dmg "$VERSION"

      - name: Release
        working-directory: exact-studio
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION#v}" dist/*.dmg \
            --target "$GITHUB_SHA" \
            --title "Exact Studio ${VERSION#v}" \
            --generate-notes \
            --notes "Install: https://github.com/$GITHUB_REPOSITORY#install"
